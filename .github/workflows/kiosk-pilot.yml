name: Kiosk pilot installers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/kiosk-pilot.yml
      - kiosk/**
      - src/lib/kiosk.ts
      - src/components/focus/StudentFocusMonitor.tsx

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            command: pilot:win:x64
            artifact: windows-x64
            extension: exe
          - runner: macos-latest
            command: pilot:mac:arm64
            artifact: macos-arm64
            extension: dmg
          - runner: macos-15-intel
            command: pilot:mac:x64
            artifact: macos-x64
            extension: dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kiosk/package-lock.json
      - run: npm ci
        working-directory: kiosk
      - run: npm test
        working-directory: kiosk
      - run: npm run ${{ matrix.command }}
        working-directory: kiosk
      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-pilot-${{ matrix.artifact }}
          path: kiosk/release/MRLC-LMS-Kiosk-*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 30
