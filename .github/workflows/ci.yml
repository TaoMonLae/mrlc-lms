name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mrlc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mrlc_test
      SESSION_SECRET: ci-only-session-secret-change-me
      APP_URL: http://127.0.0.1:8000
      PORT: 8000
      SEED_ADMIN_PASSWORD: admin123
      SEED_TEACHER_PASSWORD: teacher123
      SEED_STUDENT_PASSWORD: student123
      BACKUP_DIR: /tmp/mrlc-ci-backups
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:prod
      - run: npx prisma migrate deploy
      - run: npm run seed
      - run: npm run test:unit
      - run: npm run lint
      - run: npx prisma validate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
